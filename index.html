<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSudan Org | المبادرة السودانية للأمن السيبراني</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body, html {
            background: #000;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.3; }

        .terminal-window {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 900px;
            height: 80vh;
            margin: 5vh auto;
            background: rgba(0, 10, 0, 0.85);
            border: 1px solid #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-header {
            background: #00ff41;
            color: #000;
            padding: 5px 15px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .output {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 16px;
        }

        .input-line {
            display: flex;
            padding: 10px 20px;
            background: rgba(0, 40, 0, 0.5);
            border-top: 1px solid #004400;
        }

        .prompt { color: #00ff41; margin-left: 10px; }
        
        input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex: 1;
            caret-color: #00ff41;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.1);
            position: absolute;
            top: 0;
            z-index: 20;
            animation: scan 4s linear infinite;
        }

        @keyframes scan { from { top: 0; } to { top: 100%; } }
        
        .highlight { color: #fff; text-shadow: 0 0 5px #00ff41; }
        .command { color: #ffeb3b; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="scanline"></div>

    <div class="terminal-window">
        <div class="terminal-header">
            <span>TERMINAL: CYBERSUDAN_V2.0</span>
            <span>STATUS: CONNECTED</span>
        </div>
        <div class="output" id="out">
[+] INITIALIZING CYBERSUDAN SECURE PROTOCOL...
[+] LOADING SYSTEM CORE: <span class="highlight">SUDARIS</span>
[+] LOCATION: KHARTOUM, SUDAN
[+] DATE: 2026-05-15

<span class="highlight">أهلاً بك في المبادرة السودانية للأمن السيبراني.</span>
اكتب <span class="command">'help'</span> لعرض الأوامر المتاحة.
        </div>
        <div class="input-line">
            <span class="prompt">root@cybersudan:~#</span>
            <input type="text" id="in" autofocus autocomplete="off">
        </div>
    </div>

    <script>
        // Matrix Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "010101";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            for(let i=0; i<drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random()*letters.length));
                ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // Terminal Logic
        const input = document.getElementById('in');
        const output = document.getElementById('out');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.toLowerCase().trim();
                handleCommand(cmd);
                input.value = '';
            }
        });

        function handleCommand(cmd) {
            let res = `\n<span class="prompt">root@cybersudan:~#</span> ${cmd}\n`;
            
            if (cmd === 'help') {
                res += `الأوامر المتاحة:
- <span class="command">about</span>: نبذة عن المبادرة
- <span class="command">goals</span>: أهدافنا
- <span class="command">sudaris</span>: مشروع الذكاء الاصطناعي
- <span class="command">clear</span>: مسح الشاشة`;
            } else if (cmd === 'about') {
                res += "نحن منظمة سودانية تهدف لرفع الوعي بالأمن السيبراني وحماية البنية التحتية الرقمية في السودان.";
            } else if (cmd === 'goals') {
                res += "1. بناء قدرات الشباب السوداني.\n2. البحث في التهديدات السيبرانية المحلية.\n3. تطوير حلول أمنية مفتوحة المصدر.";
            } else if (cmd === 'sudaris') {
                res += "Sudaris هو نظام ذكاء اصطناعي متطور (Core) قيد التطوير لخدمة أغراض التحليل الأمني.";
            } else if (cmd === 'clear') {
                output.innerHTML = "[+] Terminal Cleared.";
                return;
            } else {
                res += "خطأ: الأمر غير معروف. اكتب 'help' للأوامر.";
            }
            
            output.innerHTML += res;
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
