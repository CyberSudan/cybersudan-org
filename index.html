<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSudan Org | الأمن السيبراني السوداني</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* تأثير الخلفية المتساقطة */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .terminal {
            width: 90%;
            max-width: 800px;
            background: rgba(0, 20, 0, 0.85);
            border: 1px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            padding: 30px;
            position: relative;
        }

        .terminal::before {
            content: "SYSTEM STATUS: SECURE";
            position: absolute;
            top: -20px;
            left: 20px;
            background: #00ff41;
            color: #000;
            padding: 2px 10px;
            font-size: 12px;
        }

        h1 { font-size: 2.5rem; text-shadow: 0 0 10px #00ff41; margin-bottom: 10px; }
        .tagline { color: #888; margin-bottom: 30px; border-left: 3px solid #00ff41; padding-left: 15px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            border: 1px dashed #00ff41;
            padding: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .card:hover {
            background: #00ff41;
            color: #000;
        }

        .cursor { display: inline-block; width: 10px; height: 20px; background: #00ff41; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="terminal">
        <h1>CyberSudan<span class="cursor"></span></h1>
        <p class="tagline">المبادرة السودانية لتعزيز الأمن الرقمي وبناء القدرات السيبرانية.</p>
        
        <div class="grid">
            <div class="card">
                <h3>[ البحوث والتحليل ]</h3>
                <p>دراسة الثغرات وتأمين الأنظمة الوطنية.</p>
            </div>
            <div class="card">
                <h3>[ التوعية الرقمية ]</h3>
                <p>نشر ثقافة الأمن المعلوماتي للمجتمع السوداني.</p>
            </div>
            <div class="card">
                <h3>[Sudaris Core]</h3>
                <p>تطوير حلول الذكاء الاصطناعي الأمنية.</p>
            </div>
        </div>

        <p style="margin-top: 40px; font-size: 12px; color: #444;">root@cybersudan:~# _</p>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
